---
version: "3"

services:
  home-assistant:
    image: bdossantos/home-assistant:2026.9.1-a72868c@sha256:ed64212082a4e23748c35895df1105b2827b7bb6da0ef1069271e8bc41f5196f
    container_name: home-assistant
    volumes:
      - /dev/bus/usb:/dev/bus/usb:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/dbus:/run/dbus:ro
      - /volume1/homes/admin/Code/bds.home.arpa/homeassistant:/config:rw
    environment:
      - TZ=Europe/Paris
    ports:
      - 5353:5353/udp
      - 8123:8123/tcp
      - 21063:21063/tcp
    #networks:
    #  - home-assistant
    network_mode: host
    restart: always
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node_exporter
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points"
      - "^/(rootfs/)?(dev|etc|host|proc|run|sys|volume1)($$|/)"
    ports:
      - 9100:9100/tcp
    networks:
      monitoring:
        aliases:
          - nas.bds.home.arpa
    pid: host
    restart: always
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    volumes:
      - /volume1/docker_datas/prometheus:/prometheus:rw
    command:
      - "--config.file=/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=360d"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 9090:9090/tcp
    networks:
      - monitoring
    restart: always
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    container_name: grafana
    volumes:
      - /volume1/docker_datas/grafana:/var/lib/grafana
    ports:
      - 3000:3000/tcp
    environment:
      - GF_INSTALL_PLUGINS=grafana-strava-datasource,grafana-worldmap-panel
      - GF_PLUGINS_ENABLE_ALPHA=true
      - GF_STRAVA_DS_DATA_PATH=/var/lib/grafana/strava
    networks:
      - monitoring
    restart: always
  paperless-ngx:
    image: bdossantos/paperless-ngx:3.4.2-d49d111@sha256:1e39e1c517689d6ddd412803612f841cdb812a728435769adea0133f9259912d
    container_name: paperless
    depends_on:
      - paperless-broker
      - paperless-gotenberg
      - paperless-tika
    ports:
      - 8000:8000/tcp
    volumes:
      - /volume1/docker_datas/paperless/consume:/app/consume
      - /volume1/docker_datas/paperless/data:/app/data
      - /volume1/docker_datas/paperless/export:/app/export
      - /volume1/docker_datas/paperless/media:/app/media
      - /volume1/docker_datas/paperless/static:/app/static
    environment:
      - PAPERLESS_DBENGINE=sqlite
      - >-
        PAPERLESS_DB_OPTIONS=init_command=PRAGMA journal_mode=WAL;PRAGMA
        synchronous=NORMAL;PRAGMA busy_timeout=30000;PRAGMA
        cache_size=-65536;PRAGMA
        temp_store=MEMORY,transaction_mode=IMMEDIATE
      - PAPERLESS_FILENAME_FORMAT={{ created_year }}/{{ title }}
      - PAPERLESS_CONSUMER_DELETE_DUPLICATES=true
      - PAPERLESS_READ_CACHE_REDIS_URL=redis://paperless-broker:6379
      - PAPERLESS_READ_CACHE_TTL=3600
      - PAPERLESS_REDIS=redis://paperless-broker:6379
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_ENDPOINT=http://papereless-tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3001
      - PAPERLESS_WEBSERVER_WORKERS=2
    env_file:
      - /volume1/docker_datas/paperless/.env
    networks:
      - paperless
    restart: always
  paperless-broker:
    image: redis:8.10.3-trixie@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    container_name: paperless-broker
    ports:
      - 6379:6379/tcp
    networks:
      - paperless
    restart: always
  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    container_name: paperless-gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    environment:
      - DISABLE_GOOGLE_CHROME=1
    ports:
      - 3001:3000/tcp
    networks:
      - paperless
    restart: always
  paperless-tika:
    image: docker.io/apache/tika:4.2.0-1@sha256:b99f19c4fd76237dafe7d22f719b9bddfa9a449da687c597a41e2f6d9a595418
    container_name: paperless-tika
    ports:
      - 9998:9998/tcp
    networks:
      - paperless
    restart: always
  anki:
    image: bdossantos/anki:26.9.4-d49d111@sha256:f8383e9e57c8c8912457e2fd5fbf7f21f8ef7e0af88c674940b600f7b747ef28
    container_name: anki
    ports:
      - 8081:8080/tcp
    volumes:
      - /volume1/docker_datas/anki/data:/data
    environment:
      - SYNC_BASE=/data
    env_file:
      - /volume1/docker_datas/anki/.env
    networks:
      - anki
    restart: always
  radicale:
    image: bdossantos/radicale:3.9.1-d49d111@sha256:54c26d168225d37c7d3ff72551cdbfbc170a7c2976d68d10b78135439388abb5
    container_name: radicale
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker_datas/radicale/data:/data
      - /volume1/docker_datas/radicale/users:/config/users:ro
    shm_size: 8M
    ports:
      - 5232:5232/tcp
    networks:
      - radicale
    restart: always

networks:
  home-assistant:
    ipam:
      driver: default
      config:
        - subnet: 172.10.0.0/16
          gateway: 172.10.0.1
  monitoring:
    ipam:
      driver: default
      config:
        - subnet: 172.11.0.0/16
          gateway: 172.11.0.1
  paperless:
    ipam:
      driver: default
      config:
        - subnet: 172.12.0.0/16
          gateway: 172.12.0.1
  anki:
    ipam:
      driver: default
      config:
        - subnet: 172.13.0.0/16
          gateway: 172.13.0.1
  radicale:
    ipam:
      driver: default
      config:
        - subnet: 172.14.0.0/16
          gateway: 172.14.0.1
