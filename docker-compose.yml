---
version: "3"

services:
  home-assistant:
    image: bdossantos/home-assistant:2026.9.1-a72868c@sha256:ed64212082a4e23748c35895df1105b2827b7bb6da0ef1069271e8bc41f5196f
    container_name: home-assistant
    volumes:
      - /dev/bus/usb:/dev/bus/usb:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/dbus:/run/dbus:ro
      - /volume1/homes/admin/Code/bds.home.arpa/homeassistant:/config:rw
    environment:
      - TZ=Europe/Paris
    ports:
      - 5353:5353/udp
      - 8123:8123/tcp
      - 21063:21063/tcp
    #networks:
    #  - home-assistant
    network_mode: host
    restart: always
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node_exporter
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points"
      - "^/(rootfs/)?(dev|etc|host|proc|run|sys|volume1)($$|/)"
    ports:
      - 9100:9100/tcp
    networks:
      monitoring:
        aliases:
          - nas.bds.home.arpa
    pid: host
    restart: always
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    volumes:
      - /volume1/docker_datas/prometheus:/prometheus:rw
    command:
      - "--config.file=/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=360d"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 9090:9090/tcp
    networks:
      - monitoring
    restart: always
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: grafana
    volumes:
      - /volume1/docker_datas/grafana:/var/lib/grafana
    ports:
      - 3000:3000/tcp
    environment:
      - GF_INSTALL_PLUGINS=grafana-strava-datasource,grafana-worldmap-panel
      - GF_PLUGINS_ENABLE_ALPHA=true
      - GF_STRAVA_DS_DATA_PATH=/var/lib/grafana/strava
    networks:
      - monitoring
    restart: always
  paperless-ngx:
    image: bdossantos/paperless-ngx:3.4.1-3efff71@sha256:210eeeeeefe5255ec65bf39b885ba19484fdaba5aa9986b26ee3ce7b09f131e8
    container_name: paperless
    depends_on:
      - paperless-broker
      - paperless-db
      - paperless-gotenberg
      - paperless-tika
    ports:
      - 8000:8000/tcp
    volumes:
      - /volume1/docker_datas/paperless/consume:/app/consume
      - /volume1/docker_datas/paperless/data:/app/data
      - /volume1/docker_datas/paperless/export:/app/export
      - /volume1/docker_datas/paperless/media:/app/media
      - /volume1/docker_datas/paperless/static:/app/static
    environment:
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBPORT=5433
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_FILENAME_FORMAT={{ created_year }}/{{ title }}
      - PAPERLESS_READ_CACHE_REDIS_URL=redis://paperless-broker:6379
      - PAPERLESS_READ_CACHE_TTL=3600
      - PAPERLESS_REDIS=redis://paperless-broker:6379
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_ENDPOINT=http://papereless-tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3001
      - PAPERLESS_WEBSERVER_WORKERS=2
    env_file:
      - /volume1/docker_datas/paperless/.env
    networks:
      - paperless
    restart: always
  paperless-db:
    image: postgres:14.24-bookworm@sha256:a389ed49344afc8f4444efd4eb512965df07aaa6ed84b239b54a23246e9fe347
    container_name: paperless-db
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker_datas/paperless-db/14/data:/var/lib/postgresql/data
    env_file:
      - /volume1/docker_datas/paperless/.env
    command: -p 5433 -c shared_buffers=512MB -c effective_cache_size=2GB -c maintenance_work_mem=512MB -c min_wal_size=100MB -c max_wal_size=2GB -c max_worker_processes=4 -c max_parallel_workers_per_gather=2 -c max_parallel_workers=4 -c max_parallel_maintenance_workers=2 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=4 -c effective_io_concurrency=2
    ports:
      - 5433:5433/tcp
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
    networks:
      - paperless
    restart: always
  paperless-broker:
    image: redis:8.10.3-trixie@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
    container_name: paperless-broker
    ports:
      - 6379:6379/tcp
    networks:
      - paperless
    restart: always
  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    container_name: paperless-gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    environment:
      - DISABLE_GOOGLE_CHROME=1
    ports:
      - 3001:3000/tcp
    networks:
      - paperless
    restart: always
  paperless-tika:
    image: docker.io/apache/tika:4.2.0-1@sha256:b99f19c4fd76237dafe7d22f719b9bddfa9a449da687c597a41e2f6d9a595418
    container_name: paperless-tika
    ports:
      - 9998:9998/tcp
    networks:
      - paperless
    restart: always
  anki:
    image: bdossantos/anki:25.9.2-3efff71@sha256:6b9abb8499798c7a03b27f1d7f515d61a04bc2b5d6fcd339235f8ca5ea1535fd
    container_name: anki
    ports:
      - 8081:8080/tcp
    volumes:
      - /volume1/docker_datas/anki/data:/data
    environment:
      - SYNC_BASE=/data
    env_file:
      - /volume1/docker_datas/anki/.env
    networks:
      - anki
    restart: always
  radicale:
    image: bdossantos/radicale:3.9.0-3efff71@sha256:997f820544f6d0f61727f358ccb844119c070e5d8516aea63133a34b538cf383
    container_name: radicale
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker_datas/radicale/data:/data
      - /volume1/docker_datas/radicale/users:/config/users:ro
    shm_size: 8M
    ports:
      - 5232:5232/tcp
    networks:
      - radicale
    restart: always

networks:
  home-assistant:
    ipam:
      driver: default
      config:
        - subnet: 172.10.0.0/16
          gateway: 172.10.0.1
  monitoring:
    ipam:
      driver: default
      config:
        - subnet: 172.11.0.0/16
          gateway: 172.11.0.1
  paperless:
    ipam:
      driver: default
      config:
        - subnet: 172.12.0.0/16
          gateway: 172.12.0.1
  anki:
    ipam:
      driver: default
      config:
        - subnet: 172.13.0.0/16
          gateway: 172.13.0.1
  radicale:
    ipam:
      driver: default
      config:
        - subnet: 172.14.0.0/16
          gateway: 172.14.0.1
