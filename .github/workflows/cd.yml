---
name: CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          username: bdossantos
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Dockefile build context, image name and tags
        shell: bash
        id: context
        run: |
          version=$(egrep ' VERSION=(.*)$' 'Dockerfile' | sed 's/^.*=//')
          vcs_ref=$(git rev-parse --short HEAD)
          image_name='home-assistant'
          tags=bdossantos/${image_name}:latest,bdossantos/${image_name}:${version},bdossantos/${image_name}:${version}-${vcs_ref}
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "path=$(dirname ${{ inputs.dockerfile }})" >> $GITHUB_OUTPUT
          echo "tags=${tags}" >> $GITHUB_OUTPUT
          echo "vcs_ref=${vcs_ref}" >> $GITHUB_OUTPUT
      - name: Build and push docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7
        with:
          build-args: |
            BUILD_DATE=${{ steps.context.outputs.build_date }}
            VCS_REF=${{ steps.context.outputs.vcs_ref }}
          context: ${{ steps.context.outputs.path }}
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.context.outputs.tags }}
